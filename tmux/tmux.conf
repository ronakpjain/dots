# Remote tmux configuration for Hercules. Catppuccin Mocha colors match Ghostty.

# Preserve Unicode/Nerd Font glyphs when tmux is started by a non-interactive SSH command.
set-environment -g LANG en_US.UTF-8

# Advertise truecolor to tmux applications while using a portable TERM inside panes.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Ghostty mouse/trackpad scroll events control tmux's own retained pane history.
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g escape-time 10

# Predictable window and pane numbering; keep current paths when splitting.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u

# Compact Catppuccin Mocha status line.
set -g status-position top
set -g status-interval 5
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 40
set -g status-right-length 50
set -g status-left '#[fg=#89b4fa,bold] #S #[fg=#585b70]│ '
set -g status-right '#[fg=#a6adc8]%Y-%m-%d %H:%M #[default]'
set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
setw -g window-status-format '#[fg=#a6adc8] #I:#W #[default]'
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #[default]'

# Familiar defaults with convenient split/window and config-reload bindings.
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Vi-style copy-mode selection (copy into tmux's buffer; prefix ] pastes it).
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
