# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

allow_remote_control yes

shell_integration no-sudo
window_margin_width 5

# BEGIN_KITTY_FONTS
font_family      family="Hack Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# font
font_size 11.0
modify_font cell_height 100%

# Send Ctrl-M / Ctrl-Shift-M as distinct Ctrl-Enter CSI-u events instead of
# legacy Enter/CR. Pi maps them to model cycling forward/backward.
map ctrl+m send_text kitty \e[13;5u
map ctrl+shift+m send_text kitty \e[13;6u
